# pnpm 11 reads build-script policy from here, not from package.json.
# The three `false` entries are firebase-tools' transitive deps; none of their
# build steps are needed for the CLI or the app to run.
# esbuild's install script only verifies the platform binary its optional
# dependency already provides, so it is allowed to keep installs quiet.
allowBuilds:
  '@firebase/util': false
  esbuild: true
  protobufjs: false
  re2: false
